name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # Python layer only. The R scripts need Bioconductor and MEGENA,
      # which are too slow for free CI runners (see README, known limitations).
      - name: Run tests
        run: pytest -q
